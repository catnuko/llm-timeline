name: Collect

on:
  schedule:
    # 每周一 09:30 Asia/Shanghai（UTC 01:30）
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 拉取候选
        env:
          WINDOW_DAYS: 45
        run: npm run collect

      - name: 落地候选到 models.ts
        run: |
          npm run apply | tee /tmp/apply.log
          echo "---- 待人工 ----" >> /tmp/apply.log
          node -e "const d=require('./data/review.json');console.log(d.length?d.map(x=>\`- ${x.date} · ${x.name} · ${x.org}（${x.reason}）\`).join('\\n'):'（空）')" >> /tmp/apply.log

      - name: 构建校验
        run: npm run build

      - name: 有变更则提交到分支
        id: commit
        run: |
          set -e
          if git diff --quiet -- src/data/models.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "本周没有可自动收录的候选"
            exit 0
          fi
          BRANCH="auto/collect-$(date -u +%Y%m%d-%H%M)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name "llm-timeline-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/data/models.ts data/candidates.json data/review.json
          COUNT=$(grep -c "^  + " /tmp/apply.log || true)
          git commit -s -m "data: 自动收录 ${COUNT} 条候选发布（$(date -u +%F)）"
          git push origin "$BRANCH"

      - name: 开 PR 并开启自动合并
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh pr create \
            --base master \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "data: 自动收录候选（$(date -u +%F)）" \
            --body "$(printf '由 `collect` workflow 自动生成。\n\n```\n%s\n```\n\n构建通过后自动合并。' "$(cat /tmp/apply.log)")"
          gh pr merge --squash --auto "${{ steps.commit.outputs.branch }}"

      - name: 待人工候选 → issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const fs=require('fs');
            let d=[]; try{ d=JSON.parse(fs.readFileSync('data/review.json','utf8')) }catch{}
            const body='以下候选未自动收录，需要人工判断（多为派生格式、疑似重新上架或开闭源口径存疑）：\n\n'+
              d.map(x=>'- \`'+x.date+' · '+x.name+' · '+x.org+'\` — '+x.reason).join('\n');
            fs.writeFileSync('/tmp/review-body.md', d.length?body:'本轮没有待人工候选。');
            console.log(d.length);
          " > /tmp/review-count.txt
          COUNT=$(cat /tmp/review-count.txt)
          [ "$COUNT" = "0" ] && exit 0
          gh label create collect-review --color FFD39A --description "候选采集待人工确认" 2>/dev/null || true
          EXIST=$(gh issue list --label collect-review --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body-file /tmp/review-body.md
          else
            gh issue create --title "候选待人工确认" --label collect-review --body-file /tmp/review-body.md
          fi
